[package]
name = "AeoEngine"
version = "0.7.0"
edition = "2024"

[dependencies]
gl = "0.14.0"
glam = "0.33.7"
glutin = "0.32.3"
glutin-winit = "0.5.0"
winit = "0.30.13"
egui = "0.29.1"
egui-winit = { version = "0.29.1", default-features = false, features = ["links", "clipboard"] }
egui_glow = "0.29.1"
glow = "0.14.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25.5", default-features = false, features = ["png"] }
rfd = "0.15.0"
chrono = "0.4"
